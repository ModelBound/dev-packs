name: ModelBound Skill Check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  skill-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ModelBound/skill-check-action@v1.0.3
        with:
          mode: full
          skills-glob: |
            architecture/**/*.md
            data/**/*.md
            frameworks/**/*.md
            languages/**/*.md
            process/**/*.md
            quality/**/*.md
            .github/skills/**/SKILL.md
        env:
          MODELBOUND_API_KEY: ${{ secrets.MODELBOUND_API_KEY }}
